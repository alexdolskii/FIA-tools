name: Runtime storage and diagnostics

on:
  push:
    branches: [main, tech_dev]
    paths:
      - 'fia-tools/**'
      - 'tests/test_run_resources.py'
      - '.github/workflows/runtime.yml'
  pull_request:
    paths:
      - 'fia-tools/**'
      - 'tests/test_run_resources.py'
      - '.github/workflows/runtime.yml'
  workflow_dispatch:

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install lightweight test dependencies
        run: python -m pip install pytest "psutil>=5.9,<8" "numpy==1.26.4" "scikit-image==0.25.2" scipy pandas openpyxl pillow
      - name: Test runtime ownership, processes and temporary files
        run: python -m pytest -q tests/test_run_resources.py
